name = "natto-dms-recife-protectsat-cron"
main = "src/index.js"
compatibility_date = "2026-08-01"

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "nattodms-recife-rotadb"
database_id = "COLE-AQUI-O-ID-DO-D1-nattodms-recife-rotadb"

[vars]
PROTECTSAT_ENABLED = "true"
PROTECTSAT_BASE_URL = "https://api.protectsat.com.br/wsprotect/protect.php"
PROTECTSAT_FUNCAO = "grid_monitoramento"
DEPARTURE_GEOFENCE_NAME = "NOTARO ALIMENTOS - RECIFE/PE"
DEPARTURE_GEOFENCE_NAMES = "NOTARO ALIMENTOS LTDA. - RECIFE/PE|NOTARO ALIMENTOS - RECIFE/PE"
DEPARTURE_GEOFENCE_RADIUS_METERS = "120"
DEPARTURE_GPS_MAX_AGE_MINUTES = "20"
DEPARTURE_GPS_TRANSITION_LOOKBACK_MINUTES = "720"
DEPARTURE_GPS_EXIT_BUFFER_METERS = "40"
DEPARTURE_GPS_EARLY_WINDOW_MINUTES = "60"
DEPARTURE_GPS_LATE_WINDOW_MINUTES = "720"
DEPARTURE_GPS_OUTSIDE_CONFIRMATIONS = "2"
RETURN_GEOFENCE_NAMES = "NOTARO ALIMENTOS LTDA. - RECIFE/PE|NOTARO ALIMENTOS - RECIFE/PE"
RETURN_GEOFENCE_RADIUS_METERS = "120"
